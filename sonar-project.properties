sonar.projectKey=Diegomcha_AutoParte
sonar.organization=diegomcha

sonar.sources=frontend/app,backend/src/main/java,ocr/src,ocr/docker,.github,docker-compose.yml
sonar.exclusions=**/*.env
sonar.coverage.exclusions=.github/**,docker-compose.yml
sonar.tests=frontend/tests,backend/src/test/java,ocr/test

# Language specific settings
sonar.java.binaries=backend/target/classes
sonar.java.libraries=backend/target/dependency
sonar.java.test.binaries=backend/target/test-classes
sonar.java.test.libraries=backend/target/dependency
sonar.junit.reportPaths=backend/target/surefire-reports
sonar.coverage.jacoco.xmlReportPaths=backend/target/site/jacoco/jacoco.xml

sonar.testExecutionReportPaths=frontend/sonar-report.xml
sonar.typescript.tsconfigPaths=frontend/tsconfig.json
sonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
sonar.eslint.reportPaths=frontend/eslint-report.json

sonar.python.version=3.11
sonar.python.coverage.reportPaths=ocr/coverage.xml
sonar.python.xunit.reportPath=ocr/test-reports.xml