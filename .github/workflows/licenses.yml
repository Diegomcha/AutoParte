name: Update third-party licenses

on:
  push:
    branches: [main]
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "ocr/pyproject.toml"
      - "ocr/uv.lock"
      - "backend/pom.xml"
      - ".github/scripts/merge_licenses.py"
      - ".github/workflows/licenses.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-licenses
  cancel-in-progress: true

jobs:
  update-licenses:
    runs-on: ubuntu-latest
    steps:
      # CHECKOUT
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # V7.0.1

      # SETUP
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/package.json

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 21
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up UV
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: ocr

      # GENERATE LICENSE REPORTS
      - name: Generate frontend licenses report
        working-directory: frontend
        run: |
          bun ci --frozen-lockfile
          bunx license-checker@v25.0.1 --production --json > ../.github/licenses-frontend.json

      - name: Generate OCR licenses report
        working-directory: ocr
        run: uv run --locked --no-build --all-extras --with pip-licenses==5.5.5 pip-licenses --format=json --output-file=../.github/licenses-ocr.json

      - name: Generate backend licenses report
        working-directory: backend
        run: mvn license:add-third-party

      # MERGE LICENSE REPORTS
      - name: Merge notices into THIRD_PARTY_NOTICES.md
        run: uv run --no-build --no-project .github/scripts/merge_licenses.py

      # UPDATE WIKI
      - name: Update wiki page
        uses: Andrew-Chen-Wang/github-wiki-action@1bbb4280446f9630e8e21a18012cbacf3b0f992e # v5.0.6
        with:
          path: .github/wiki
