name: Test licensing CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "ocr/pyproject.toml"
      - "ocr/uv.lock"
      - "backend/pom.xml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-licenses:
    name: Scan ${{ matrix.directory }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [frontend, backend, ocr]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Scan licenses
        uses: anistark/feluda@c9e5737c2fe7e02d86abd9d4aedee00b371f1d9b
        with:
          fail-on-restrictive: true
          update-badge: false

      - name: Generate compliance files
        run: |
          echo "1" | feluda generate  # Auto-select NOTICE file
          echo "2" | feluda generate  # Auto-select THIRD_PARTY_LICENSES file

      - name: Generate SBOM
        run: |
          feluda sbom spdx --output sbom.spdx.json
          feluda sbom cyclonedx --output sbom.cyclonedx.json

      - name: Validate SBOM files
        run: |
          feluda sbom validate sbom.spdx.json --output sbom-spdx-validation.txt
          feluda sbom validate sbom.cyclonedx.json --output sbom-cyclonedx-validation.txt

      - name: Upload compliance artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: license-compliance-${{ matrix.directory }}
          path: |
            ${{ matrix.directory }}/NOTICE
            ${{ matrix.directory }}/THIRD_PARTY_LICENSES.md
            ${{ matrix.directory }}/sbom.spdx.json
            ${{ matrix.directory }}/sbom.cyclonedx.json
