name: Generate THIRD_PARTY_NOTICES.md

on:
  push:
    branches: [main]
    paths:
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "ocr/pyproject.toml"
      - "ocr/uv.lock"
      - "backend/pom.xml"
  workflow_dispatch:

permissions:
  contents: write # Needed to commit THIRD_PARTY_NOTICES.md back to repo

jobs:
  update-licenses:
    runs-on: ubuntu-latest
    steps:
      # CHECKOUT
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # V6.0.2

      # SETUP
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/package.json

      - name: Cache Bun dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/bun.lock') }}

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: 21
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up UV
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          working-directory: ocr

      # GENERATE LICENSE REPORTS
      - name: Generate frontend licenses report
        working-directory: frontend
        run: |
          bun ci --frozen-lockfile
          bunx license-checker@v25.0.1 --production --json > ../.github/licenses-frontend.json

      - name: Generate OCR licenses report
        working-directory: ocr
        run: |
          uv sync --locked --extra cpu,dev --no-install-project
          uv run --with pip-licenses==5.5.5 pip-licenses --format=json --ignore-package=autoparte-ocr --output-file=../.github/licenses-ocr.json

      - name: Generate backend licenses report
        working-directory: backend
        run: mvn license:add-third-party

      # 3. Merge Reports into Root File
      - name: Merge notices into THIRD_PARTY_NOTICES.md
        run: uv run .github/scripts/merge_licenses.py

      # 4. Auto-commit updated file back to GitHub
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add THIRD_PARTY_NOTICES.md
          git commit -m "docs: update THIRD_PARTY_NOTICES.md [skip ci]" || echo "No changes to commit"
          git push origin main || echo "No changes to push"
