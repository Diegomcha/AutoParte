name: CI-CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  sonar-qube:
    name: SonarQube
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # CHECKOUT
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # V6.0.2
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      # SETUP
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/package.json

      - name: Cache Bun dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/bun.lock') }}

      - name: Set up JDK 21
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: 21
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml

      # FRONTEND
      - name: (Frontend) Install dependencies
        working-directory: frontend
        run: bun ci --frozen-lockfile

      - name: (Frontend) Build
        working-directory: frontend
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bun run build

      - name: (Frontend) Run ESLint and generate report
        working-directory: frontend
        continue-on-error: true
        run: bun run lint:ci

      - name: (Frontend) Run tests and generate coverage
        working-directory: frontend
        continue-on-error: true
        run: bun run test --coverage

      # BACKEND
      - name: (Backend) Copy dependencies for SonarQube
        working-directory: backend
        run: mvn -B dependency:copy-dependencies

      - name: (Backend) Build
        working-directory: backend
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: mvn -B compile

      - name: (Backend) Run tests and generate reports
        working-directory: backend
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: mvn -B verify

      # SCAN
      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@59db25f34e16620e48ab4bb9e4a5dce155cb5432 # v8.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  detect-changes:
    name: Detect changes
    runs-on: ubuntu-latest
    needs: sonar-qube
    permissions:
      contents: read
    outputs:
      app: ${{ steps.filter.outputs.app }}
      ocr: ${{ steps.filter.outputs.ocr }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # V6.0.2

      - name: Check for changes in the relevant directories
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          base: ${{ github.ref }}
          filters: |
            app:
              - './backend/**'
              - './frontend/**'
            ocr:
              - './ocr/**'

