name: CI

permissions:
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonar-qube:
    name: SonarQube
    runs-on: ubuntu-latest
    steps:
      # CHECKOUT
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # V6.0.2
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      # SETUP
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/package.json

      - name: Cache Bun dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.bun/install/cache
          key: bun-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('frontend/bun.lock') }}

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: 21
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml

      # FRONTEND
      - name: (Frontend) Install dependencies
        working-directory: frontend
        run: bun ci --frozen-lockfile

      - name: (Frontend) Build
        working-directory: frontend
        run: bun run build

      - name: (Frontend) Run ESLint and generate report
        working-directory: frontend
        continue-on-error: true
        run: bun run lint:ci

      - name: (Frontend) Run tests and generate coverage
        working-directory: frontend
        continue-on-error: true
        run: bun run test --coverage

      # BACKEND
      - name: (Backend) Copy dependencies for SonarQube
        working-directory: backend
        run: mvn -B dependency:copy-dependencies

      - name: (Backend) Build
        working-directory: backend
        run: mvn -B compile

      - name: (Backend) Run tests and generate reports
        working-directory: backend
        continue-on-error: true
        run: mvn -B verify

      # SCAN
      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@59db25f34e16620e48ab4bb9e4a5dce155cb5432 # v8.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
