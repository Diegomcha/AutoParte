name: CI-CD

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  sonar-qube:
    name: SonarQube
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # CHECKOUT
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # V7.0.1
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis

      # SETUP
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/package.json

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 21
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Set up UV
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          working-directory: ocr

      # FRONTEND
      - name: (Frontend) Install dependencies
        working-directory: frontend
        run: bun ci --frozen-lockfile

      - name: (Frontend) Build
        working-directory: frontend
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bun run -b build

      - name: (Frontend) Run ESLint and generate report
        working-directory: frontend
        continue-on-error: true
        run: bun run -b lint:ci

      - name: (Frontend) Run tests and generate coverage
        working-directory: frontend
        continue-on-error: true
        run: bun run -b test --coverage

      # BACKEND
      - name: (Backend) Copy dependencies for SonarQube
        working-directory: backend
        run: mvn -B dependency:copy-dependencies

      - name: (Backend) Build
        working-directory: backend
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: mvn -B compile

      - name: (Backend) Run tests and generate reports
        working-directory: backend
        continue-on-error: true
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: mvn -B verify

      # OCR
      - name: (OCR) Install dependencies, run tests and generate reports
        working-directory: ocr
        continue-on-error: true
        run: uv run --locked --no-build --extra cpu,dev -m pytest --cov --cov-report=xml --cov-branch

      # SCAN
      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  build-app:
    name: Build APP image
    runs-on: ubuntu-latest
    needs: sonar-qube
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      # Checkout
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # V7.0.1

      # Setup
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: frontend/package.json

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 21
          distribution: temurin
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Extract container metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}_app
          sep-tags: ","

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build frontend
      - name: Install frontend dependencies
        working-directory: frontend
        run: bun ci --frozen-lockfile

      - name: Build frontend
        working-directory: frontend
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: bun run -b build

      # Test building images (PR)
      - name: Build with Maven (No Publish)
        if: github.event_name == 'pull_request'
        run: mvn clean package

      # Build and push with attestation (main branch)
      - name: Build and push Docker image
        id: push
        if: github.event_name != 'pull_request'
        working-directory: backend
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_NAME: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}_app
        run: |
          # Lowercase the image name for consistency
          LOWERCASED_IMAGE_NAME="${IMAGE_NAME,,}"

          # Build & push image
          mvn clean spring-boot:build-image \
            -Dspring-boot.build-image.imageName=$LOWERCASED_IMAGE_NAME \
            -Dspring-boot.build-image.publish=true

          # Extract the image digest
          IMAGE_DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' "$LOWERCASED_IMAGE_NAME" | cut -d'@' -f2)
          echo "digest=${IMAGE_DIGEST}" >> $GITHUB_OUTPUT

      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: github.event_name != 'pull_request'
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}_app
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  build-ocr:
    name: Build OCR images
    runs-on: ubuntu-latest
    needs: sonar-qube
    strategy:
      fail-fast: false
      matrix:
        type: [cpu, gpu]
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      # Checkout
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # V7.0.1

      # Setup
      - name: Extract container metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}_ocr
          flavor: |
            suffix=-${{ matrix.type }},onlatest=true

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Build and push with attestation
      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./ocr
          file: ./ocr/docker/${{ matrix.type }}.Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Generate artifact attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: github.event_name != 'pull_request'
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}_ocr
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build-app
      - build-ocr
    environment:
      name: production
      url: ${{ vars.URL }}
    permissions:
      id-token: write
    steps:
      # Checkout
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # V7.0.1

      # Setup
      - name: Connect to Tailscale
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: ${{ secrets.TS_TAGS }}

      - name: Ping deployment server
        run: tailscale ping ${{ vars.SERVER_HOST }} --c 1

      - name: Perform deployment over SSH
        env:
          APP_PATH: ${{ vars.SERVER_PATH }}
          HOST: ${{ vars.SERVER_HOST }}
          USER: ${{ vars.SERVER_USER }}
        run: |
          scp -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null docker-compose.yml $USER@$HOST:$APP_PATH

          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null $USER@$HOST << EOF
            cd $APP_PATH
            chmod 640 docker-compose.yml
            docker compose up -d --remove-orphans --pull always --quiet-pull
            docker image prune -f
          EOF
