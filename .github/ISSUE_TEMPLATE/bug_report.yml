name: Bug report
description: Create a bug report to help us detect defects & improve AutoParte
title: 'fix: '
type: Bug

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! Please provide as much detailed information as possible so we can reproduce and address the issue quickly.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: Select the level of impact this issue has on usability or functionality.
      options:
        - "sev: trivial"
        - "sev: minor"
        - "sev: major"
        - "sev: critical"
    validations:
      required: true

  - type: textarea
    id: reproduction-steps
    attributes:
      label: Reproduction steps
      description: How do you trigger this bug? Please walk us through it step-by-step.
      value: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Logs
      description: Drag & drop screenshots, videos, or paste relevant error output here to help explain your problem.

  - type: input
    id: app-version
    attributes:
      label: Application Version
      placeholder: "e.g. 1.0.0"
    validations:
      required: true

  - type: input
    id: docker-version
    attributes:
      label: Docker Version
      placeholder: "e.g. 28.5.1"

  - type: input
    id: browser
    attributes:
      label: Client Browser
      placeholder: "e.g. Chrome, Firefox, Safari"

  - type: input
    id: os
    attributes:
      label: Client OS
      placeholder: "e.g. macOS, Windows, iOS, Android"

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context, configuration, or environment details about the problem here.

  - type: checkboxes
    id: terms
    attributes:
      label: Code of Conduct & Contribution
      options:
        - label: I have searched existing issues to ensure this is not a duplicate.
          required: true
