[build-system]
requires = ["setuptools~=82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "autoparte-ocr"
version = "1.0.0"
requires-python = "~=3.11.0"
dependencies = [
    "fastapi~=0.136.1",
    "granian~=2.7.4",
    "mrz~=0.6.2",
    "python-multipart~=0.0.27",
    "rapidocr~=3.8.1",
]

[tool.setuptools]
py-modules = ["api", "ocr"]

[project.optional-dependencies]
deploy = ["uvloop~=0.22.1"]
cpu = ["onnxruntime~=1.25.1"]
gpu = ["onnxruntime-gpu~=1.25.1", "torch~=2.10.0"]
