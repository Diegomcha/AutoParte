# Development environment configuration
autoparte.ses.url=https://hospedajes.pre-ses.mir.es/hospedajes-web/ws/v1/comunicacion
# Enable sentry in development mode & disable profiler to avoid errors in Windows machines
sentry.environment=development
sentry.profiles-sample-rate=0
# Database configuration for temporary database
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.flyway.enabled=false
# Docker Compose integration
spring.docker.compose.file=compose-temp-db.yaml
spring.docker.compose.lifecycle-management=start-and-stop
