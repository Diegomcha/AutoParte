autoparte.ocr.url=http://localhost:6543
autoparte.ses.url=https://hospedajes.pre-ses.mir.es/hospedajes-web/ws/v1/comunicacion
autoparte.ses.initial-username=${SES_USERNAME}
autoparte.ses.initial-password=${SES_PASSWORD}
autoparte.ses.initial-landlord-code=${SES_LANDLORD_CODE}
