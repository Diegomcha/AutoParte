autoparte.ocr-url=http://localhost:6543
autoparte.ses.endpoint=https://hospedajes.pre-ses.mir.es/hospedajes-web/ws/v1/comunicacion
autoparte.ses.username=${SES_USERNAME}
autoparte.ses.password=${SES_PASSWORD}
autoparte.ses.landlord-code=${SES_LANDLORD_CODE}
#
spring.jpa.hibernate.ddl-auto=create-drop
#
server.servlet.session.cookie.same-site=lax
#
springdoc.swagger-ui.path=/api/docs/ui
springdoc.api-docs.path=/docs
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
#
sentry.enabled=false
#
logging.level.org.springframework.ws.client.MessageTracing.sent=TRACE
logging.level.org.springframework.ws.client.MessageTracing.received=TRACE