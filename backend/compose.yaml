services:
  postgres:
    image: 'postgres:latest'
    environment:
      - 'POSTGRES_DB=mydatabase'
      - 'POSTGRES_PASSWORD=secret'
      - 'POSTGRES_USER=myuser'
    ports:
      - '5432:5432'
  ocr:
    build:
      context: ../ocr
      dockerfile: docker/cpu.Dockerfile
    ports:
      - '6543:80'
